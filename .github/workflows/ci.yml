name: CI - Django and Vue

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / Django / pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Configure test environment
        run: cp config.py_template config.py
      - name: Python syntax check
        run: python -m compileall -q main system utils apps tests
      - name: Django system checks
        run: python manage.py check --settings=test_settings
      - name: Backend tests with coverage and JUnit
        run: |
          mkdir -p test-results
          pytest -q --junitxml=test-results/pytest.xml --cov=system --cov=utils --cov=apps --cov-report=xml:test-results/coverage.xml --cov-report=term-missing
      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/test-results/
          retention-days: 14
          if-no-files-found: warn

  frontend:
    name: Frontend / Vitest / Vite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          package-manager-cache: false
      # No committed package-lock.json yet. Use npm install until a lockfile is
      # generated, reviewed and committed, then switch this step to npm ci.
      - name: Install frontend dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Frontend unit tests
        run: npm test
      - name: Build production assets
        run: npm run build
      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7
          if-no-files-found: error
